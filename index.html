<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>SIM-RUANG UNESA</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f9f9f9; margin: 0; }
    header { background: #004080; color: white; padding: 15px; text-align: center; }
    header img { height: 50px; vertical-align: middle; margin-right: 10px; }
    .container { max-width: 400px; margin: 40px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #004080; }
    input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #004080; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0066cc; }
    .toggle { text-align: center; margin-top: 10px; }
    .contact-info { text-align: center; margin-top: 20px; font-size: 14px; }
    .contact-info img { vertical-align: middle; margin-left: 5px; }
  </style>
</head>
<body>

<header>
  <img src="https://upload.wikimedia.org/wikipedia/commons/4/4e/Logo_UNESA.png" alt="UNESA Logo">
  <span>SIM-RUANG UNESA</span>
</header>

<div class="container" id="section-auth">
  <h2>Login SIM-RUANG</h2>
  <input type="text" id="username" placeholder="Email/NIM/NIP">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <div class="toggle">
    <a href="#" onclick="showRegister()">Belum punya akun? Registrasi</a>
  </div>
</div>

<div class="container hidden" id="section-register">
  <h2>Registrasi SIM-RUANG</h2>
  <input type="text" id="reg-nama" placeholder="Nama Lengkap">
  <input type="text" id="reg-prodi" placeholder="Asal/Prodi">
  <input type="text" id="reg-nim" placeholder="NIM/NIP">
  <input type="text" id="reg-hp" placeholder="No HP">
  <input type="email" id="reg-email" placeholder="Email">
  <input type="text" id="reg-username" placeholder="Username">
  <input type="password" id="reg-password" placeholder="Password">
  <button onclick="register()">Registrasi</button>
  <div class="toggle">
    <a href="#" onclick="showLogin()">Sudah punya akun? Login</a>
  </div>
</div>

<div class="contact-info">
  <strong>Admin SIM-RUANG:</strong> Syahri
  <a href="https://wa.me/6281331382680" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" width="20">
  </a>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwj4hYY-pF1IbsKgTEYqW5dGrrUJYaC7e_S4SyR8dVlKkK35oSx-1I2Vfdz07sBoTT4Tg/exec"; // ganti dengan URL Web App hasil deploy

function showRegister() {
  document.getElementById("section-auth").classList.add("hidden");
  document.getElementById("section-register").classList.remove("hidden");
}
function showLogin() {
  document.getElementById("section-register").classList.add("hidden");
  document.getElementById("section-auth").classList.remove("hidden");
}

// Login
function login() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const url = SCRIPT_URL + "?action=loginUser&username=" + encodeURIComponent(username) + "&password=" + encodeURIComponent(password) + "&callback=cb_login";
  const script = document.createElement("script");
  script.src = url;
  document.body.appendChild(script);
}

function cb_login(response) {
  if (response.status === "success") {
    alert("Login berhasil sebagai " + response.role);
    // TODO: masuk ke dashboard
  } else {
    alert(response.message || "Login gagal!");
  }
}

// Registrasi
function register() {
  const url = SCRIPT_URL + "?action=registerUser"
    + "&nama=" + encodeURIComponent(document.getElementById("reg-nama").value)
    + "&prodi=" + encodeURIComponent(document.getElementById("reg-prodi").value)
    + "&nim=" + encodeURIComponent(document.getElementById("reg-nim").value)
    + "&hp=" + encodeURIComponent(document.getElementById("reg-hp").value)
    + "&email=" + encodeURIComponent(document.getElementById("reg-email").value)
    + "&username=" + encodeURIComponent(document.getElementById("reg-username").value)
    + "&password=" + encodeURIComponent(document.getElementById("reg-password").value)
    + "&callback=cb_register";
  const script = document.createElement("script");
  script.src = url;
  document.body.appendChild(script);
}

function cb_register(response) {
  if (response.status === "success") {
    alert(response.message);
    showLogin();
  } else {
    alert(response.message || "Registrasi gagal!");
  }
}
</script>
</body>
</html>
